spring:
  datasource:
    # @ServiceConnection replaces these values. Without a container, fail closed.
    url: jdbc:mysql://127.0.0.1:1/testcontainers_required
    username: testcontainers_required
    password: testcontainers_required
    hikari:
      # Commands serialize on the administration guard while holding a connection, so with four connections the
      # other concurrent requests queue for one. 1s ran out under the parallel suite (#201); 30s is Hikari's default.
      connection-timeout: 30000
      initialization-fail-timeout: 1
      maximum-pool-size: 4
  flyway:
    url: jdbc:mysql://127.0.0.1:1/testcontainers_required
    clean-disabled: true
    baseline-on-migrate: false
  session:
    jdbc:
      cleanup-cron: "-"
openstudy:
  # #100: tests run the retention rules themselves; the daily job never fires in between.
  retention:
    schedule-enabled: false
  avatar:
    storage: memory
  security:
    # Production cost is 12. Fixture hashing and logins at that cost took most of the suite's run time.
    bcrypt-strength: 4
  auth:
    login-limit:
      source:
        # Every integration test logs in from 127.0.0.1 within one shared context.
        # Source limiting is verified in AuthHttpTests with the production default and distinct peers.
        max-attempts: 100000
