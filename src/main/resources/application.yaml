spring:
  config:
    import: "optional:file:./.env[.properties]"
  application:
    name: openstudy-backend
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-null-for-primitives: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    timeout: 60m
    jdbc:
      initialize-schema: never
server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
  # Keep NONE: ClientAddressResolver applies X-Forwarded-For itself, only behind TRUSTED_PROXIES.
  forward-headers-strategy: none
openstudy:
  web:
    # Comma-separated IPs/CIDRs of the reverse proxy directly in front of this app. Empty ignores X-Forwarded-For.
    trusted-proxies: ${TRUSTED_PROXIES:}
  auth:
    login-limit:
      # Confirmed in issue #28. Per-instance memory; reset on restart.
      account:
        max-attempts: 10
        window-minutes: 15
      source:
        max-attempts: 30
        window-minutes: 15
      capacity: 10000
