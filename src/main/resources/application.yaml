spring:
  config:
    import:
      - "optional:file:./.env[.properties]"
      - "optional:file:./.env.qwen.local[.properties]"
      - "optional:file:../.env.qwen.local[.properties]"
  application:
    name: openstudy-backend
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-null-for-primitives: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    # API responses are DTOs. Long requests (e.g. AI queries) must not retain an EntityManager/DB connection.
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    timeout: 60m
    jdbc:
      initialize-schema: never
  # Profile photos are at most 5 MiB (#120, M14-D10). The servlet limit sits a little above it so the API answers
  # 422 AVATAR_TOO_LARGE from its own check; anything past the limit is mapped to the same 422.
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB
server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
  # Keep NONE: ClientAddressResolver applies X-Forwarded-For itself, only behind TRUSTED_PROXIES.
  forward-headers-strategy: none
# #102 (ADR-M11-001 M11-D04): health only, status without details. Readiness fails while the DB is down;
# liveness does not, so ECS does not restart a healthy process for a DB outage.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
openstudy:
  # Profile photos (#120): s3 in operations (OPENSTUDY_AVATAR_STORAGE=s3 with bucket and region, see
  # docs/deployment/avatar-bucket-request.md), directory for local development.
  avatar:
    storage: ${OPENSTUDY_AVATAR_STORAGE:directory}
    directory: ${OPENSTUDY_AVATAR_DIRECTORY:./data/avatars}
    s3:
      bucket: ${OPENSTUDY_AVATAR_S3_BUCKET:}
      region: ${OPENSTUDY_AVATAR_S3_REGION:}
  # Team chat left the service (ADR-M10-002 M10-D10, #167). Off hides every /api/channels/** operation (404).
  team-chat:
    enabled: ${OPENSTUDY_TEAM_CHAT_ENABLED:false}
  web:
    # Comma-separated IPs/CIDRs of the reverse proxy directly in front of this app. Empty ignores X-Forwarded-For.
    trusted-proxies: ${TRUSTED_PROXIES:}
  auth:
    login-limit:
      # Confirmed in issue #28. Per-instance memory; reset on restart.
      account:
        max-attempts: 10
        window-minutes: 15
      source:
        max-attempts: 30
        window-minutes: 15
      capacity: 10000
  ai:
    # Empty = real current time (ADR-M10-003). Set it only to replay the PoC fixtures (2026-11-02T05:00:00Z).
    fixed-as-of: ${OPENSTUDY_AI_FIXED_AS_OF:}
    # playback replays recorded model answers; live calls Qwen and needs QWEN_API_KEY (e.g. in .env.qwen.local).
    model-mode: ${OPENSTUDY_AI_MODEL_MODE:playback}
    rate-limit:
      max-concurrent: ${OPENSTUDY_AI_RATE_LIMIT_MAX_CONCURRENT:10}
      max-per-minute: ${OPENSTUDY_AI_RATE_LIMIT_MAX_PER_MINUTE:120}
domainlens:
  embedding:
    provider: ${DOMAINLENS_EMBEDDING_PROVIDER:onnx}
    directory: ${DOMAINLENS_EMBEDDING_DIRECTORY:.models/koen-e5-tiny-q8}
  model:
    mode: ${DOMAINLENS_MODEL_MODE:playback}
    base-url: ${QWEN_BASE_URL:https://token-plan.maas.qwencloudapi.com/compatible-mode/v1}
    api-key: ${QWEN_API_KEY:}
    name: ${QWEN_MODEL:qwen3.8-flash}
    enable-thinking: false
