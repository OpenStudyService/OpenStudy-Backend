spring:
  config:
    import:
      - "optional:file:./.env[.properties]"
      - "optional:file:./.env.qwen.local[.properties]"
      - "optional:file:../.env.qwen.local[.properties]"
  application:
    name: openstudy-backend
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-null-for-primitives: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    # API responses are DTOs. Long-lived SSE requests must not retain an EntityManager/DB connection.
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    timeout: 60m
    jdbc:
      initialize-schema: never
server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
  # Keep NONE: ClientAddressResolver applies X-Forwarded-For itself, only behind TRUSTED_PROXIES.
  forward-headers-strategy: none
openstudy:
  web:
    # Comma-separated IPs/CIDRs of the reverse proxy directly in front of this app. Empty ignores X-Forwarded-For.
    trusted-proxies: ${TRUSTED_PROXIES:}
  auth:
    login-limit:
      # Confirmed in issue #28. Per-instance memory; reset on restart.
      account:
        max-attempts: 10
        window-minutes: 15
      source:
        max-attempts: 30
        window-minutes: 15
      capacity: 10000
  ai:
    fixed-as-of: ${OPENSTUDY_AI_FIXED_AS_OF:2026-11-02T05:00:00Z}
    # playback replays recorded model answers; live calls Qwen and needs QWEN_API_KEY (e.g. in .env.qwen.local).
    model-mode: ${OPENSTUDY_AI_MODEL_MODE:playback}
    rate-limit:
      max-concurrent: ${OPENSTUDY_AI_RATE_LIMIT_MAX_CONCURRENT:10}
      max-per-minute: ${OPENSTUDY_AI_RATE_LIMIT_MAX_PER_MINUTE:120}
domainlens:
  embedding:
    provider: ${DOMAINLENS_EMBEDDING_PROVIDER:onnx}
    directory: ${DOMAINLENS_EMBEDDING_DIRECTORY:.models/koen-e5-tiny-q8}
  model:
    mode: ${DOMAINLENS_MODEL_MODE:playback}
    base-url: ${QWEN_BASE_URL:https://token-plan.maas.qwencloudapi.com/compatible-mode/v1}
    api-key: ${QWEN_API_KEY:}
    name: ${QWEN_MODEL:qwen3.8-flash}
    enable-thinking: false
