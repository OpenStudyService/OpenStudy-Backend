plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.openstudy'
version = '0.0.1-SNAPSHOT'
description = 'openstudy-backend'

springBoot {
    mainClass = 'com.openstudy.OpenstudyBackendApplication'
}

tasks.register('ownerBootstrap', JavaExec) {
    group = 'application'
    description = 'Create the initial OWNER using process environment only; does not start the server.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.openstudy.bootstrap.OwnerBootstrap'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('org.springframework.ai:spring-ai-bom:2.0.1')
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-session-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.flywaydb:flyway-mysql'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'
    implementation 'com.microsoft.onnxruntime:onnxruntime:1.22.0'
    implementation 'ai.djl.huggingface:tokenizers:0.28.0'
    implementation 'org.springframework.ai:spring-ai-client-chat'
    implementation 'org.springframework.ai:spring-ai-openai'
    implementation 'org.jspecify:jspecify:1.0.0'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'com.mysql:mysql-connector-j'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-mail-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-session-jdbc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-mysql'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
    // Every Spring test context the suite caches (one per distinct test configuration) stays in this JVM. At ~80 suites
    // the 512 MiB Gradle default ran out of heap (2026-11-05, #87), so the worker gets more room.
    maxHeapSize = '1g'
    systemProperty 'ownerBootstrap.runtimeClasspath', sourceSets.main.runtimeClasspath.asPath
    // Service connections override these values. An unconfigured test must fail closed.
    systemProperty 'spring.profiles.active', 'test'
    systemProperty 'spring.datasource.url', 'jdbc:mysql://127.0.0.1:1/testcontainers_required'
    systemProperty 'spring.flyway.url', 'jdbc:mysql://127.0.0.1:1/testcontainers_required'
    // System properties outrank the imported .env, so a developer's real SMTP settings can never send test mail.
    systemProperty 'openstudy.invitation-mail.enabled', 'false'
    if (providers.gradleProperty('foundationExportDir').isPresent()) {
        systemProperty 'foundation.exportDir', file(providers.gradleProperty('foundationExportDir').get()).absolutePath
    }
}
