# Local stand-in for Infra's terraform/aws/templates/nginx.conf.tftpl /api location (TLS ends here).
# Differences: self-signed certificate instead of ACME, no CORS maps (same-origin checks only), and the
# upstream is the Backend container directly because no separate Gateway image exists (docs/deployment/README.md).
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }

http {
  access_log /dev/stdout;
  server_tokens off;

  server {
    listen 8443 ssl;
    http2 on;
    server_name localhost;
    ssl_certificate /certs/proxy.pem;
    ssl_certificate_key /certs/proxy.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location ~ ^/api(?:/|$) {
      proxy_pass http://app:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_read_timeout 300s;
    }
    location / { return 404; }
  }
}
