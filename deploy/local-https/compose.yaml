# Local verification of the runtime image behind a TLS-terminating proxy. Not a deployment definition.
# Usage and what it does not prove: docs/deployment/README.md#로컬-https-검증
name: openstudy-local-https

x-db-url: &app-db-url "jdbc:mysql://mysql:3306/openstudy?sslMode=VERIFY_IDENTITY&trustCertificateKeyStoreUrl=file:/certs/db-truststore.p12&trustCertificateKeyStoreType=PKCS12&trustCertificateKeyStorePassword=local-public-ca"

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  migrations:

services:
  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: local-root-password
      MYSQL_DATABASE: openstudy
    command:
      - --require-secure-transport=ON
      - --ssl-ca=/certs/ca.pem
      - --ssl-cert=/certs/mysql.pem
      - --ssl-key=/certs/mysql.key
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - ./.local/certs:/certs:ro
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    networks: [edge]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-plocal-root-password"]
      interval: 5s
      retries: 30

  # Copies the SQL shipped in the image (/app/db/migration) for the external migration runner.
  migrations:
    image: ${BACKEND_IMAGE:-openstudy-backend:local}
    user: "0"
    entrypoint: ["sh", "-c", "cp /app/db/migration/V*.sql /migrations/"]
    volumes:
      - migrations:/migrations
    profiles: [tools]

  # Same Flyway CLI, driver and TLS mode as Infra's scripts/migrate-database.py, with the migration account.
  migrate:
    image: flyway/flyway:11.20.2
    command:
      - -url=jdbc:mysql://mysql:3306/openstudy?permitMysqlScheme=true&sslMode=verify-full&serverSslCert=/certs/ca.pem
      - -driver=org.mariadb.jdbc.Driver
      - -user=openstudy_migrator
      - -password=local-migrator-password
      - -locations=filesystem:/migrations
      - -cleanDisabled=true
      - -baselineOnMigrate=false
      - -validateMigrationNaming=true
      - -failOnMissingLocations=true
      - -placeholderReplacement=false
      - -initSql=SET time_zone = '+00:00'
      - migrate
    volumes:
      - migrations:/migrations:ro
      - ./.local/certs:/certs:ro
      # Replace the image's bundled 2.x driver in place so only Infra's 3.5.9 driver is on the classpath.
      - ./.local/drivers/mariadb-java-client-3.5.9.jar:/flyway/drivers/mariadb-java-client-2.7.13.jar:ro
    networks: [edge]
    depends_on:
      mysql: { condition: service_healthy }
    profiles: [tools]

  app:
    image: ${BACKEND_IMAGE:-openstudy-backend:local}
    environment:
      DB_URL: *app-db-url
      DB_USERNAME: openstudy_app
      DB_PASSWORD: local-app-password
      TRUSTED_PROXIES: 172.30.0.10/32
    volumes:
      - ./.local/certs/db-truststore.p12:/certs/db-truststore.p12:ro
    networks: [edge]
    # Mirrors the ECS stop timeout on EC2 (30s) before SIGKILL.
    stop_grace_period: 30s
    depends_on:
      mysql: { condition: service_healthy }

  proxy:
    image: nginx:1.30.6-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./.local/certs:/certs:ro
    ports:
      - "127.0.0.1:8443:8443"
    networks:
      edge:
        ipv4_address: 172.30.0.10
    depends_on: [app]
